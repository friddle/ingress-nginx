name: image-build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TAG: v1.15.16

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binaries (linux/amd64)
        run: ARCH=amd64 TAG=${TAG} make build

      - name: Build and push image
        run: |
          docker buildx build \
            --push \
            --pull \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE="$(cat NGINX_BASE)" \
            --build-arg VERSION="${TAG}" \
            --build-arg COMMIT_SHA="git-$(git rev-parse --short HEAD)" \
            -t "ghcr.io/${GITHUB_REPOSITORY_OWNER}/ingress-nginx:${TAG}" \
            rootfs
